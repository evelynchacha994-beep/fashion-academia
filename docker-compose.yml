services:
  db:
    image: postgres:15-alpine
    container_name: fashion_academia_db
    restart: always
    environment:
      POSTGRES_DB: academia_fashion
      POSTGRES_USER: evelyn
      POSTGRES_PASSWORD: fashion2026
    ports:
      - "5432:5432"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evelyn -d academia_fashion"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: fashion_academia_backend
    restart: always
    ports:
      - "8086:80"
    environment:
      DB_HOST: db
      DB_NAME: academia_fashion
      DB_USER: evelyn
      DB_PASS: fashion2026
    volumes:
      # 1. Backend API en subcarpeta /api/ (Mantiene tu estructura limpia)
      - ./backend:/var/www/html/api
      # 2. Frontend en la RAÍZ de Apache (SOLUCIONA LA PANTALLA BLANCA)
      - ./frontend/index.html:/var/www/html/index.html
      # 3. Persistencia de sesiones PHP entre reinicios
      - php_sessions:/tmp
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  php_sessions: